spring.application.name=RealTimeChatApp

# Server Configuration
server.port=8081

# Database Configuration - Set via environment variables on Render
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.root=INFO
logging.level.com.chat.app=DEBUG
logging.level.org.springframework.security=WARN
logging.file.name=logs/chat-app.log

# JWT Configuration - use environment variable in production
app.jwt.secret=${JWT_SECRET:MyVerySuperSecretKeyForJWTTokenGenerationAndValidationPurposeOnlyPleaseMakeItMoreSecure}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.suffix=.html

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-size=52428800

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
